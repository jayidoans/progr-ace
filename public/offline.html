<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080d1b" />
    <title>You're offline · ProgrACE</title>
    <style>
      :root { color-scheme: light dark; font-family: Arial, sans-serif; }
      body { align-items: center; background: #080d1b; color: #f8fafc; display: flex; margin: 0; min-height: 100dvh; padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom)); }
      main { margin: 0 auto; max-width: 440px; width: 100%; }
      .brand { color: #6ee7b7; font-size: 14px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
      h1 { font-size: clamp(2rem, 8vw, 3rem); margin: 16px 0; }
      p { color: #cbd5e1; font-size: 1rem; line-height: 1.6; margin: 0; }
      .retry-status { color: #94a3b8; font-size: .875rem; margin-top: 12px; }
      a { background: #34d399; border-radius: 8px; color: #052e26; display: inline-block; font-weight: 700; margin-top: 28px; padding: 12px 18px; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">ProgrACE</div>
      <h1>You're offline</h1>
      <p>ProgrACE needs an internet connection to access your latest training data. Check your connection and try again.</p>
      <p class="retry-status" role="status">We&apos;ll try again automatically in 10 seconds.</p>
      <a href="/dashboard">Try Again</a>
    </main>
    <script defer src="/offline.js"></script>
  </body>
</html>
